{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Cancelled — MIMOSA Atelier</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}?v=20260612-mobile">
</head>
<body class="home-page">
    {% include 'includes/header.html' with header_show_cart=True %}

    <main id="main-content" tabindex="-1" class="about-snippet" style="margin-top: 80px; max-width: 760px;">
        <h1 data-translate="pay-cancel-title">Payment cancelled</h1>
        <p data-translate="pay-cancel-text1">Your payment was not completed. Your cart has been restored — you can resume your order whenever you like.</p>
        <a class="hero-btn" href="{% url 'shop:cart' %}" data-translate="pay-cancel-btn-cart">Return to cart</a>
    </main>

    {% include 'includes/footer.html' %}
    <script src="{% static 'translations.js' %}" defer></script>
</body>
</html>
