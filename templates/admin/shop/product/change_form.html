{% extends "admin/change_form.html" %}
{% load i18n %}

{% block after_related_objects %}
{{ block.super }}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">

<style>
  :root {
    --copilot-emerald: #0d6b52;
    --copilot-emerald-hover: #0a5844;
    --copilot-gold: #d4af37;
    --copilot-gold-soft: #e8c96a;
    --copilot-obsidian: #1a1b1e;
    --copilot-obsidian-2: #24262b;
    --copilot-ivory: #f7f4ef;
    --copilot-muted: #9ca3af;
    --copilot-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }

  #mimosa-copilot-tab {
    position: fixed;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10000;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 14px 10px 14px 14px;
    border: none;
    border-radius: 10px 0 0 10px;
    background: linear-gradient(135deg, var(--copilot-emerald) 0%, #0a5844 100%);
    color: var(--copilot-gold-soft);
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
    cursor: pointer;
    box-shadow: var(--copilot-shadow);
    transition: transform 0.3s ease, padding-right 0.3s ease, background 0.2s ease;
  }

  #mimosa-copilot-tab:hover {
    padding-right: 14px;
    background: linear-gradient(135deg, var(--copilot-emerald-hover) 0%, #084a38 100%);
  }

  #mimosa-copilot-tab.is-open {
    transform: translateY(-50%) translateX(-350px);
  }

  #mimosa-copilot-panel {
    position: fixed;
    right: 0;
    top: 0;
    width: 350px;
    height: 100vh;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    background: var(--copilot-obsidian);
    color: var(--copilot-ivory);
    font-family: "DM Sans", system-ui, sans-serif;
    box-shadow: -8px 0 32px rgba(0, 0, 0, 0.4);
    transform: translateX(100%);
    transition: transform 0.3s ease;
  }

  #mimosa-copilot-panel.is-open {
    transform: translateX(0);
  }

  .copilot-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 16px 14px;
    border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    flex-shrink: 0;
  }

  .copilot-header h2 {
    margin: 0;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--copilot-gold);
    letter-spacing: 0.04em;
  }

  .copilot-header p {
    margin: 4px 0 0;
    font-size: 11px;
    color: var(--copilot-muted);
  }

  #mimosa-copilot-close {
    width: 32px;
    height: 32px;
    border: 1px solid rgba(212, 175, 55, 0.35);
    border-radius: 6px;
    background: transparent;
    color: var(--copilot-ivory);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }

  #mimosa-copilot-close:hover {
    background: var(--copilot-obsidian-2);
    border-color: var(--copilot-gold);
  }

  .copilot-lang-row {
    padding: 10px 16px;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  #copilot-lang-select {
    width: 100%;
    padding: 8px 10px;
    font-family: "DM Sans", sans-serif;
    font-size: 12px;
    border: 1px solid rgba(212, 175, 55, 0.25);
    border-radius: 6px;
    background: var(--copilot-obsidian-2);
    color: var(--copilot-ivory);
    cursor: pointer;
  }

  #mimosa-copilot-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  #mimosa-copilot-messages::-webkit-scrollbar {
    width: 6px;
  }

  #mimosa-copilot-messages::-webkit-scrollbar-thumb {
    background: rgba(212, 175, 55, 0.3);
    border-radius: 3px;
  }

  .copilot-msg {
    max-width: 92%;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .copilot-msg--user {
    align-self: flex-end;
    background: rgba(13, 107, 82, 0.45);
    border: 1px solid rgba(13, 107, 82, 0.6);
    color: var(--copilot-ivory);
  }

  .copilot-msg--ai {
    align-self: flex-start;
    background: var(--copilot-obsidian-2);
    border: 1px solid rgba(212, 175, 55, 0.15);
    color: #e8e6e3;
  }

  .copilot-msg--loading {
    align-self: flex-start;
    color: var(--copilot-muted);
    font-style: italic;
    padding: 8px 12px;
  }

  .copilot-msg--error {
    align-self: flex-start;
    background: rgba(220, 38, 38, 0.15);
    border: 1px solid rgba(220, 38, 38, 0.4);
    color: #fca5a5;
  }

  .copilot-apply-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 12px;
    font-family: "DM Sans", sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    border: 1px solid var(--copilot-gold);
    border-radius: 4px;
    background: transparent;
    color: var(--copilot-gold);
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }

  .copilot-apply-btn:hover {
    background: var(--copilot-gold);
    color: var(--copilot-obsidian);
  }

  .copilot-input-area {
    flex-shrink: 0;
    padding: 14px 16px 18px;
    border-top: 1px solid rgba(212, 175, 55, 0.2);
    background: var(--copilot-obsidian-2);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #mimosa-copilot-input {
    width: 100%;
    min-height: 72px;
    max-height: 120px;
    resize: vertical;
    padding: 10px 12px;
    font-family: "DM Sans", sans-serif;
    font-size: 13px;
    line-height: 1.45;
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    background: var(--copilot-obsidian);
    color: var(--copilot-ivory);
    box-sizing: border-box;
  }

  #mimosa-copilot-input:focus {
    outline: none;
    border-color: rgba(212, 175, 55, 0.5);
    box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.12);
  }

  #mimosa-copilot-input::placeholder {
    color: var(--copilot-muted);
  }

  #mimosa-copilot-send {
    align-self: flex-end;
    padding: 9px 22px;
    border: none;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--copilot-emerald), #0a5844);
    color: var(--copilot-gold-soft);
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }

  #mimosa-copilot-send:hover:not(:disabled) {
    transform: translateY(-1px);
  }

  #mimosa-copilot-send:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    transform: none;
  }
</style>

<button type="button" id="mimosa-copilot-tab" aria-expanded="false" aria-controls="mimosa-copilot-panel">
  ✨ Copilot
</button>

<aside id="mimosa-copilot-panel" aria-hidden="true">
  <header class="copilot-header">
    <div>
      <h2>Mimosa Copilot</h2>
      <p>Premium product descriptions</p>
    </div>
    <button type="button" id="mimosa-copilot-close" aria-label="Close">×</button>
  </header>

  <div class="copilot-lang-row">
    <select id="copilot-lang-select" title="Generation language">
      <option value="французька">🇫🇷 Français</option>
      <option value="українська">🇺🇦 Українська</option>
      <option value="англійська">🇬🇧 English</option>
      <option value="німецька">🇩🇪 Deutsch</option>
      <option value="іспанська">🇪🇸 Español</option>
      <option value="італійська">🇮🇹 Italiano</option>
      <option value="японська">🇯🇵 日本語</option>
    </select>
  </div>

  <div id="mimosa-copilot-messages" role="log" aria-live="polite"></div>

  <div class="copilot-input-area">
    <textarea
      id="mimosa-copilot-input"
      rows="3"
      placeholder="e.g. Write a description for a sea shell candle…"
    ></textarea>
    <button type="button" id="mimosa-copilot-send">Send</button>
  </div>
</aside>

<script>
(function () {
  "use strict";

  const API_ENDPOINT = "/admin/api/ai-enhance/";
  const tab = document.getElementById("mimosa-copilot-tab");
  const panel = document.getElementById("mimosa-copilot-panel");
  const closeBtn = document.getElementById("mimosa-copilot-close");
  const messagesEl = document.getElementById("mimosa-copilot-messages");
  const inputEl = document.getElementById("mimosa-copilot-input");
  const sendBtn = document.getElementById("mimosa-copilot-send");
  const langSelect = document.getElementById("copilot-lang-select");
  const descriptionField = document.getElementById("id_description");

  if (!tab || !panel || !messagesEl || !inputEl || !sendBtn) return;

  function getCsrfToken() {
    const fromCookie = document.cookie
      .split(";")
      .map(function (c) { return c.trim().split("="); })
      .find(function (pair) { return pair[0] === "csrftoken"; });
    if (fromCookie) return decodeURIComponent(fromCookie[1]);
    const input = document.querySelector("[name=csrfmiddlewaretoken]");
    return input ? input.value : "";
  }

  function openPanel() {
    panel.classList.add("is-open");
    tab.classList.add("is-open");
    panel.setAttribute("aria-hidden", "false");
    tab.setAttribute("aria-expanded", "true");
    inputEl.focus();
  }

  function closePanel() {
    panel.classList.remove("is-open");
    tab.classList.remove("is-open");
    panel.setAttribute("aria-hidden", "true");
    tab.setAttribute("aria-expanded", "false");
  }

  tab.addEventListener("click", function () {
    if (panel.classList.contains("is-open")) closePanel();
    else openPanel();
  });

  closeBtn.addEventListener("click", closePanel);

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function appendMessage(role, text, aiTextForApply) {
    const wrap = document.createElement("div");
    wrap.className = "copilot-msg copilot-msg--" + role;
    wrap.textContent = text;

    if (role === "ai" && aiTextForApply) {
      const applyBtn = document.createElement("button");
      applyBtn.type = "button";
      applyBtn.className = "copilot-apply-btn";
      applyBtn.textContent = "Apply to Description";
      applyBtn.addEventListener("click", function () {
        if (!descriptionField) {
          alert("Description field #id_description not found.");
          return;
        }
        descriptionField.value = aiTextForApply;
        descriptionField.dispatchEvent(new Event("input", { bubbles: true }));
        descriptionField.dispatchEvent(new Event("change", { bubbles: true }));
        applyBtn.textContent = "✓ Applied";
        applyBtn.disabled = true;
      });
      wrap.appendChild(document.createElement("br"));
      wrap.appendChild(applyBtn);
    }

    messagesEl.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function setLoading(on) {
    sendBtn.disabled = on;
    inputEl.disabled = on;
    if (on) {
      const el = document.createElement("div");
      el.className = "copilot-msg copilot-msg--loading";
      el.id = "copilot-loading";
      el.textContent = "✨ Composing your text…";
      messagesEl.appendChild(el);
      scrollToBottom();
    } else {
      const loading = document.getElementById("copilot-loading");
      if (loading) loading.remove();
    }
  }

  async function sendPrompt() {
    const prompt = inputEl.value.trim();
    if (!prompt) return;

    appendMessage("user", prompt);
    inputEl.value = "";
    setLoading(true);

    try {
      const response = await fetch(API_ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCsrfToken(),
        },
        body: JSON.stringify({
          draft_text: prompt,
          target_language: langSelect ? langSelect.value : "французька",
        }),
      });

      const data = await response.json();
      setLoading(false);

      if (!response.ok) {
        appendMessage("error", data.error || "Request failed (" + response.status + ")");
        return;
      }

      const enhanced = data.enhanced_description || "";
      appendMessage("ai", enhanced, enhanced);
    } catch (err) {
      setLoading(false);
      appendMessage("error", "❌ " + (err.message || "Network error"));
    }
  }

  sendBtn.addEventListener("click", sendPrompt);

  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendPrompt();
    }
  });
})();
</script>

{% endblock %}
